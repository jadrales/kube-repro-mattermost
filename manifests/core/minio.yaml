apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: mattermost
  labels:
    app: minio
    app.kubernetes.io/part-of: mattermost-repro
spec:
  selector:
    matchLabels:
      app: minio
  serviceName: minio
  replicas: 1
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: mattermost-filestore-secret
              key: accesskey
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mattermost-filestore-secret
              key: secretkey
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: minio-data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mattermost
  labels:
    app: minio
    app.kubernetes.io/part-of: mattermost-repro
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
# One-shot Job: creates the Mattermost bucket after MinIO is ready.
# Runs via the Service (not localhost), so it works correctly as a separate pod.
# ttlSecondsAfterFinished cleans it up automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: mattermost
  labels:
    app.kubernetes.io/part-of: mattermost-repro
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "waiting for minio service..."; sleep 3
          done
          mc mb --ignore-existing local/mattermost
          echo "bucket 'mattermost' ready"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: mattermost-filestore-secret
              key: accesskey
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mattermost-filestore-secret
              key: secretkey
