# OpenLDAP — mirrors the CS-Repro-Mattermost LDAP setup using rroemhild/test-openldap.
# The image pre-seeds 7 Futurama users and 2 groups (admin_staff, ship_crew) on every start.
# A seed Job adds the Robot Mafia users (dsmith, jmousepad) and the robot_mafia group.
#
# Admin bind:  cn=admin,dc=planetexpress,dc=com / GoodNewsEveryone
# Internal:    openldap.mattermost.svc.cluster.local:389
#
# NOTE: rroemhild/test-openldap is linux/amd64 only. Requires emulation on ARM (Apple Silicon).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: mattermost
  labels:
    app: openldap
    app.kubernetes.io/part-of: mattermost-repro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
      - name: openldap
        image: rroemhild/test-openldap:latest
        ports:
        - containerPort: 10389
          name: ldap
        - containerPort: 10636
          name: ldaps
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: mattermost
  labels:
    app: openldap
    app.kubernetes.io/part-of: mattermost-repro
spec:
  selector:
    app: openldap
  ports:
  - name: ldap
    port: 389
    targetPort: 10389
  - name: ldaps
    port: 636
    targetPort: 10636
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap-seed-data
  namespace: mattermost
  labels:
    app.kubernetes.io/part-of: mattermost-repro
data:
  robot-mafia-users.ldif: |
    dn: cn=Joey Mousepad,ou=people,dc=planetexpress,dc=com
    objectClass: top
    objectClass: person
    objectClass: organizationalPerson
    objectClass: inetOrgPerson
    cn: Joey Mousepad
    sn: Mousepad
    givenName: Joey
    uid: jmousepad
    userPassword: jmousepad
    mail: jmousepad@planetexpress.com
    title: Robot Mafia Henchperson

    dn: cn=Donbot Smith,ou=people,dc=planetexpress,dc=com
    objectClass: top
    objectClass: person
    objectClass: organizationalPerson
    objectClass: inetOrgPerson
    cn: Donbot Smith
    sn: Smith
    givenName: Donbot
    uid: dsmith
    userPassword: dsmith
    mail: dsmith@planetexpress.com
    title: Robot Mafia Godfather

  robot-mafia-group.ldif: |
    dn: cn=robot_mafia,ou=people,dc=planetexpress,dc=com
    objectClass: top
    objectClass: Group
    cn: robot_mafia
    member: cn=Donbot Smith,ou=people,dc=planetexpress,dc=com
    member: cn=Joey Mousepad,ou=people,dc=planetexpress,dc=com

  ship-crew-update.ldif: |
    dn: cn=ship_crew,ou=people,dc=planetexpress,dc=com
    changetype: modify
    add: member
    member: cn=Donbot Smith,ou=people,dc=planetexpress,dc=com
    member: cn=Joey Mousepad,ou=people,dc=planetexpress,dc=com

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ldap-seed
  namespace: mattermost
  labels:
    app.kubernetes.io/part-of: mattermost-repro
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
      - name: seed-data
        configMap:
          name: ldap-seed-data
      containers:
      - name: seed
        image: osixia/openldap:1.5.0
        volumeMounts:
        - name: seed-data
          mountPath: /seed
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          LDAP_URI="ldap://openldap:389"
          BIND_DN="cn=admin,dc=planetexpress,dc=com"
          BIND_PW="GoodNewsEveryone"

          echo "Waiting for OpenLDAP to be ready..."
          until ldapsearch -x -H "$LDAP_URI" -D "$BIND_DN" -w "$BIND_PW" \
            -b "dc=planetexpress,dc=com" "(uid=professor)" 2>/dev/null | grep -q "dn:"; do
            echo "  not ready, retrying in 3s..."
            sleep 3
          done
          echo "OpenLDAP is ready."

          # Idempotency check — skip if Robot Mafia already exists
          if ldapsearch -x -H "$LDAP_URI" -D "$BIND_DN" -w "$BIND_PW" \
            -b "ou=people,dc=planetexpress,dc=com" "(uid=dsmith)" 2>/dev/null | grep -q "dn:"; then
            echo "Already seeded — skipping."
            exit 0
          fi

          echo "Seeding Robot Mafia users..."
          ldapadd -c -x -H "$LDAP_URI" -D "$BIND_DN" -w "$BIND_PW" \
            -f /seed/robot-mafia-users.ldif

          echo "Creating robot_mafia group..."
          ldapadd -c -x -H "$LDAP_URI" -D "$BIND_DN" -w "$BIND_PW" \
            -f /seed/robot-mafia-group.ldif

          echo "Adding Robot Mafia to ship_crew..."
          ldapmodify -c -x -H "$LDAP_URI" -D "$BIND_DN" -w "$BIND_PW" \
            -f /seed/ship-crew-update.ldif

          echo "LDAP seed complete."
