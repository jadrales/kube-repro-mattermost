apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost
spec:
  version: ${MM_VERSION}
  size: 5000users
  # HA requires an Enterprise license (place license.mattermost in repo root)
  replicas: 2
  licenseSecret: mattermost-license

  ingress:
    enabled: true
    host: ${MM_DOMAIN}
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

  database:
    external:
      secret: mattermost-db-secret

  fileStore:
    external:
      url: minio.mattermost.svc.cluster.local:9000
      bucket: ${MINIO_BUCKET}
      secret: mattermost-filestore-secret

  mattermostEnv:
  # MinIO settings (same as single-node)
  - name: MM_FILESETTINGS_AMAZONS3SSL
    value: "false"
  - name: MM_FILESETTINGS_AMAZONS3SSE
    value: "false"
  - name: MM_FILESETTINGS_AMAZONS3SIGNV2
    value: "false"
  - name: MM_FILESETTINGS_AMAZONS3REGION
    value: "us-east-1"
  # Clustering: operator enables this automatically for replicas > 1,
  # but explicit config ensures the cluster name is predictable for repro
  - name: MM_CLUSTERSETTINGS_ENABLE
    value: "true"
  - name: MM_CLUSTERSETTINGS_CLUSTERNAME
    value: "mm-repro"
  - name: MM_CLUSTERSETTINGS_USEIPADDRESS
    value: "false"
  - name: MM_CLUSTERSETTINGS_USEDNSFORCLUSTERHOSTS
    value: "true"
  # MailHog
  - name: MM_EMAILSETTINGS_SMTPSERVER
    value: "mailhog.mattermost.svc.cluster.local"
  - name: MM_EMAILSETTINGS_SMTPPORT
    value: "1025"
  - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
    value: "false"
  - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
    value: ""
  - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
    value: "true"
  - name: MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION
    value: "false"
  # Developer settings
  - name: MM_SERVICESETTINGS_ENABLEDEVELOPER
    value: "true"
  - name: MM_SERVICESETTINGS_ENABLETESTING
    value: "true"
  - name: MM_LOGSETTINGS_CONSOLELEVEL
    value: "DEBUG"
  - name: MM_LOGSETTINGS_ENABLECONSOLE
    value: "true"
  - name: MM_LOGSETTINGS_CONSOLEJSON
    value: "false"
  - name: MM_RATELIMITSETTINGS_ENABLE
    value: "false"
  - name: MM_SERVICESETTINGS_ENABLELOCALMODE
    value: "true"
